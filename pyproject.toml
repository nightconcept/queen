[project]
name = "queen"
version = "0.0.3"
description = "Queen: a Highcard deckbuilder prototype on NightEngine (Pyxel)"
requires-python = ">=3.11"
dependencies = ["nightengine==0.2.1"]

[tool.setuptools]
packages = ["queen"]
py-modules = ["game"]

[tool.uv.sources]
nightengine = { path = "nightengine/python", editable = true }

[tool.ruff]
line-length = 120
extend-exclude = ["nightengine"]  # The engine submodule lints in its own repo.

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["queen", "nightengine"]

[tool.nightengine.web]
title = "Queen"
width = 540
height = 1170
packages = ["queen", "nightengine"]
assets = ["assets", "queen/data"]

# Portrait 540x1170 on every target: an exact 2x on 1080x2340, the smallest flagship screens.
[tool.nightengine.targets.desktop]
controls = ["keyboard", "mouse"]

[tool.nightengine.targets.web]
controls = ["keyboard", "mouse", "touch"]

[tool.nightengine.targets.android]
controls = ["touch"]

[tool.nightengine.android]
app_id = "net.nightcircle.queen"
orientation = "portrait"
icon = "android/icon.png"
keystore = "android/debug.keystore"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
