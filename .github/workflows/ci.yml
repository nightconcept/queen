name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install just
        run: uv tool install rust-just==1.58.0

      - name: Tests
        run: just check

      - name: Lint
        run: just lint

  browser:
    runs-on: ubuntu-24.04
    # Node, Playwright, and its Chromium, at the version in package.json.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install just
        run: uv tool install rust-just==1.58.0

      - name: Browser checks (offline build in Chromium)
        run: just check web

      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
